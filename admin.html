<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Admin | Stocker UNRDIP</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" type="image/png" href="favicon.png">
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<div class="wrap">
  <div id="login" class="narrow" style="margin:0 auto" hidden>
    <h1 style="font-size:1.5rem">Masuk admin</h1>
    <label for="pin">PIN</label><input id="pin" type="password" inputmode="numeric" autocomplete="off">
    <p class="note" id="msg"></p>
    <div class="tools"><button class="btn p" id="go" type="button">Masuk</button><a class="btn" href="index.html" style="text-decoration:none">Kembali</a></div>
  </div>
  <div id="ed" hidden>
    <div class="top"><h1 style="font-size:1.5rem">Admin panel</h1><span id="st"></span></div>
    <p class="note">Perubahan tersimpan otomatis sebagai draf di browser ini. Cek hasilnya dengan Lihat halaman. Agar terlihat semua orang, tekan Salin JSON lalu tempel ke file data.json di hosting (atau Unduh data.json dan ganti filenya).</p>
    <div id="form"></div>
    <div class="tools" style="margin-top:22px;flex-wrap:wrap"><button class="btn p" id="cp" type="button">Salin JSON</button><button class="btn" id="dl" type="button">Unduh data.json</button><a class="btn" href="index.html?preview=1" style="text-decoration:none">Lihat halaman</a></div>
    <div class="tools"><button class="btn" id="out" type="button">Keluar</button><button class="btn d" id="rs" type="button">Buang perubahan</button></div>
  </div>
</div>
<script src="config.js"></script>
<script src="core.js"></script>
<script>
var S=sessionStorage;var D;
var setStat=m=>$("#st").textContent=m;
function persist(){try{localStorage.setItem(LK,JSON.stringify(D));return true}catch(e){return false}}
function queue(){setStat(persist()?"Draf tersimpan":"Gagal menyimpan")}
function show(w){$("#login").hidden=w!=="login";$("#ed").hidden=w!=="ed";if(w==="ed")ui()}
var field=(l,p,v,x="")=>`<label>${l}</label><input data-p="${p}" value="${esc(v)}" ${x}>`;
function ui(){const b=D.brand;
  let s=`<h2>Judul halaman</h2>${field("Judul","brand.title",b.title)}${field("Teks lencana (di bawah judul)","brand.logoText",b.logoText)}${field("Nama anggota (pisahkan dengan - )","brand.sub",b.sub)}${field("Semboyan","brand.tag",b.tag)}${field("Link logo","brand.logoLink",b.logoLink,'inputmode="url"')}${field("Teks footer","brand.foot",b.foot)}`;
  D.groups.forEach((g,gi)=>{s+=`<h2>Grup ${gi+1}</h2>${field("Judul grup (kosongkan jika tanpa judul)",`g.${gi}.title`,g.title)}`;
    g.items.forEach((i,ii)=>{s+=`<div class="item"><label>Ikon</label><div class="icons">${PICK.map(k=>`<button type="button" data-a="ic" data-v="${k}" data-g="${gi}" data-i="${ii}" aria-pressed="${i.icon===k}" aria-label="${k}">${svg(k)}</button>`).join("")}</div>${field("Nama tombol",`i.${gi}.${ii}.name`,i.name)}${field("Keterangan",`i.${gi}.${ii}.desc`,i.desc)}${field("Link (https://…)",`i.${gi}.${ii}.url`,i.url,'inputmode="url"')}<div class="tools"><button class="btn" data-a="up" data-g="${gi}" data-i="${ii}" type="button" aria-label="Naik">↑</button><button class="btn" data-a="dn" data-g="${gi}" data-i="${ii}" type="button" aria-label="Turun">↓</button><button class="btn d" data-a="del" data-g="${gi}" data-i="${ii}" type="button">Hapus</button></div></div>`});
    s+=`<div class="tools"><button class="btn p" data-a="add" data-g="${gi}" type="button">+ Tambah link</button></div>`});
  $("#form").innerHTML=s}
function setPath(p,v){const s=p.split(".");if(s[0]==="brand")D.brand[s[1]]=v;else if(s[0]==="g")D.groups[s[1]].title=v;else D.groups[s[1]].items[s[2]][s[3]]=v}
$("#form").addEventListener("input",e=>{const p=e.target.dataset.p;if(!p)return;if(p.endsWith(".url")||p.endsWith("logoLink"))e.target.classList.toggle("bad",e.target.value!==""&&!okUrl(e.target.value));setPath(p,e.target.value);queue()});
$("#form").addEventListener("click",e=>{const t=e.target.closest("button");if(!t||!t.dataset.a)return;const g=+t.dataset.g,i=+t.dataset.i,L=D.groups[g].items,a=t.dataset.a;
  if(a==="ic")L[i].icon=t.dataset.v;
  if(a==="add")L.push({icon:"link",name:"Link baru",desc:"Keterangan singkat",url:"https://"});
  if(a==="del"&&confirm("Hapus link ini?"))L.splice(i,1);
  if(a==="up"&&i>0)[L[i-1],L[i]]=[L[i],L[i-1]];
  if(a==="dn"&&i<L.length-1)[L[i+1],L[i]]=[L[i],L[i+1]];
  ui();queue()});
function tryPin(){if($("#pin").value===String(CFG.pin||"1234")){S.setItem("adm","1");show("ed")}else{$("#msg").textContent="PIN salah";$("#pin").select()}}
$("#go").onclick=tryPin;$("#pin").onkeydown=e=>{if(e.key==="Enter")tryPin()};
$("#out").onclick=()=>{S.removeItem("adm");$("#pin").value="";$("#msg").textContent="";show("login")};
$("#rs").onclick=async()=>{if(confirm("Buang semua perubahan dan kembali ke data yang sedang tayang?")){localStorage.removeItem(LK);D=await loadPublished();ui();setStat("Draf dibuang")}};
$("#cp").onclick=async()=>{try{await navigator.clipboard.writeText(JSON.stringify(D,null,2));setStat("JSON disalin")}catch(e){setStat("Gagal menyalin, pakai Unduh")}};
$("#dl").onclick=()=>{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:"application/json"}));a.download="data.json";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1500)};
(async()=>{D=cached()||await loadPublished();show(S.getItem("adm")==="1"?"ed":"login")})();
</script>
</body>
</html>
